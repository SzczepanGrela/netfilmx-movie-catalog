<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetFilmx Design Explorer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Roboto:wght@400;500;700&family=Playfair+Display:wght@700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        /* BASE APP STYLES */
        :root {
            --app-bg: #09090b;
            --app-text: #e4e4e7;
            --app-border: #27272a;
            --app-panel: #18181b;
            --app-accent: #3b82f6;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0; background: var(--app-bg); color: var(--app-text);
            font-family: 'Inter', sans-serif;
        }
        
        /* HEADER & CONTROLS */
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 40px; border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(24, 24, 27, 0.6); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            position: sticky; top: 0; z-index: 50; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .filters { display: flex; gap: 15px; }
        select, button.btn {
            background: rgba(39, 39, 42, 0.8); color: #fff; border: 1px solid rgba(255,255,255,0.1);
            padding: 10px 20px; border-radius: 8px; outline: none; cursor: pointer;
            font-family: inherit; font-size: 14px; transition: 0.2s; font-weight: 500;
        }
        button.btn:hover { background: rgba(63, 63, 70, 0.8); }
        button.btn.active { background: var(--app-accent); border-color: var(--app-accent); box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4); }
        
        /* CATALOG GRID */
        main { padding: 60px 40px; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 40px; }
        .theme-card {
            background: var(--app-panel); border: 1px solid rgba(255,255,255,0.05);
            border-radius: 16px; overflow: hidden; cursor: pointer; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; flex-direction: column; position: relative;
            will-change: transform;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            transform: translateZ(0);
        }
        .theme-card:hover { transform: translateY(-8px) scale(1.02) translateZ(0); box-shadow: 0 20px 40px rgba(0,0,0,0.6); z-index: 5; border-color: rgba(255,255,255,0.2); }
        .theme-preview {
            height: 180px; width: 100%; position: relative;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .mini-poster {
            width: 45px; height: 65px; background-position: center; background-size: cover;
            will-change: transform; backface-visibility: hidden; -webkit-backface-visibility: hidden; transform: translateZ(0);
            border: 1px solid transparent;
        }
        .theme-info { padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        .theme-name { font-weight: 600; font-size: 16px; letter-spacing: -0.5px; }
        .theme-rating { color: #fbbf24; font-weight: bold; font-size: 14px; background: rgba(251, 191, 36, 0.1); padding: 4px 8px; border-radius: 6px; }
        
        /* MODAL */
        #modal {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(5px);
            z-index: 100; display: none; padding: 20px;
        }
        #modal.open { display: flex; }
        .modal-container {
            width: 100%; height: 100%; display: flex; gap: 20px;
        }
        
        /* MODAL SIDEBAR (CONTROLS) */
        .modal-sidebar {
            width: 300px; background: var(--app-panel); border: 1px solid var(--app-border);
            border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 24px;
        }
        .modal-sidebar h2 { margin: 0; font-size: 20px; }
        .close-btn {
            background: #ef4444; width: 100%; text-align: center; margin-top: auto;
        }
        .close-btn:hover { background: #dc2626; }
        
        .rating-box { background: #000; padding: 15px; border-radius: 8px; text-align: center; }
        .stars { display: flex; justify-content: center; gap: 8px; font-size: 24px; cursor: pointer; color: #3f3f46; }
        .stars span.active { color: #fbbf24; }
        
        .layout-btn { width: 100%; text-align: left; margin-bottom: 8px; display: flex; justify-content: space-between; }
        
        /* MOCK BROWSER */
        .modal-main {
            flex: 1; display: flex; flex-direction: column; min-width: 0;
        }
        .browser-frame {
            background: #1e1e1e; border: 1px solid #333; border-radius: 12px;
            display: flex; flex-direction: column; height: 100%; overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }
        .browser-header {
            background: #202124; display: flex; flex-direction: column;
        }
        .browser-tabs {
            display: flex; align-items: flex-end; padding: 8px 8px 0 8px; gap: 4px;
        }
        .browser-tab {
            background: #323639; color: #9aa0a6; padding: 8px 16px; border-radius: 8px 8px 0 0;
            font-size: 12px; display: flex; align-items: center; gap: 8px; max-width: 200px;
        }
        .browser-tab.active { background: #323639; color: #fff; }
        .browser-toolbar {
            height: 36px; background: #323639; border-bottom: 1px solid #000;
            display: flex; align-items: center; padding: 0 12px; gap: 12px;
        }
        .browser-url {
            flex: 1; background: #202124; border-radius: 99px; height: 28px;
            color: #fff; font-size: 13px; display: flex; align-items: center; padding: 0 16px;
        }
        .win-controls {
            position: absolute; top: 0; right: 0; display: flex;
        }
        .win-btn {
            width: 46px; height: 32px; display: flex; justify-content: center; align-items: center;
            color: #9aa0a6; transition: 0.2s; cursor: default;
        }
        .win-btn:hover { background: rgba(255,255,255,0.1); }
        .win-btn.close:hover { background: #e81123; color: #fff; }
        .browser-body { flex: 1; position: relative; overflow-y: auto; overflow-x: hidden; background: #000; }
        
        /* -----------------------------------------------------
           VOD MOCK CSS (THEME DYNAMIC)
           These use variables injected via JS
        ------------------------------------------------------ */
        #vod-root {
            background-color: var(--t-bg);
            color: var(--t-txt);
            font-family: var(--t-font), sans-serif;
            min-height: 100%;
            display: flex;
        }
        
        /* LAYOUT: STANDARD */
        #vod-root.layout-standard { flex-direction: column; }
        .l-standard-nav {
            display: flex; align-items: center; padding: 20px 4%; gap: 30px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            position: absolute; top: 0; width: 100%; z-index: 10;
        }
        .l-standard-logo { font-size: 24px; font-weight: 800; color: var(--t-acc); letter-spacing: -1px; }
        .l-standard-links { display: flex; gap: 20px; font-weight: 500; font-size: 14px; opacity: 0.8; }
        
        .l-standard-hero {
            height: 60vh; position: relative; display: flex; flex-direction: column; justify-content: flex-end; padding: 4%;
            background-size: cover; background-position: center;
        }
        .l-standard-hero::after {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(to top, var(--t-bg) 0%, transparent 100%);
        }
        .hero-content { position: relative; z-index: 5; max-width: 500px; }
        .hero-title { font-size: 48px; font-weight: 800; margin: 0 0 10px 0; line-height: 1.1; font-family: var(--t-title-font, inherit); }
        .hero-desc { font-size: 15px; opacity: 0.8; margin-bottom: 20px; line-height: 1.5; }
        .hero-btn {
            background: var(--t-acc); color: #fff; border: none; padding: 10px 24px; border-radius: var(--t-rad);
            font-weight: 600; font-size: 16px; cursor: pointer;
        }
        
        .l-standard-row { padding: 0 4% 40px 4%; }
        .l-standard-row h3 { font-size: 20px; margin-bottom: 15px; font-weight: 600; }
        .poster-scroll { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 15px; scrollbar-width: none; }
        .poster {
            flex: 0 0 150px; height: 225px; background: #333; border-radius: var(--t-rad);
            background-size: cover; background-position: center; cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94), box-shadow 0.3s;
            box-shadow: var(--t-shadow); border: var(--t-border);
            will-change: transform;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            transform: translateZ(0);
        }
        .poster:hover { transform: scale(1.05) translateZ(0); z-index: 2; }
        
        /* LAYOUT: MINIMAL (Sidebar + Grid) */
        #vod-root.layout-minimal { flex-direction: row; }
        .l-min-sidebar {
            width: 80px; background: var(--t-surf); border-right: var(--t-border);
            display: flex; flex-direction: column; align-items: center; padding: 20px 0; gap: 30px;
        }
        .l-min-icon { width: 40px; height: 40px; border-radius: var(--t-rad); background: var(--t-bg); display: flex; justify-content: center; align-items: center; color: var(--t-acc); }
        .l-min-main { flex: 1; padding: 40px; }
        .l-min-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 20px; margin-top: 30px; }
        
        /* LAYOUT: CINEMATIC */
        #vod-root.layout-cinematic { flex-direction: column; position: relative; }
        .l-cine-nav { display: flex; justify-content: space-between; align-items:center; padding: 30px 4%; position: absolute; top:0; width:100%; z-index: 10; font-weight: bold; }
        .l-cine-bg { position: absolute; inset: 0; background-size: cover; background-position: top center; z-index: 1; }
        .l-cine-bg::after { content:''; position:absolute; inset:0; background: linear-gradient(to right, rgba(0,0,0,0.9) 10%, transparent 60%), linear-gradient(to top, var(--t-bg) 5%, transparent 40%); }
        .l-cine-content { z-index: 2; position: relative; padding: 25vh 4% 0 4%; max-width: 600px; }
        .l-cine-title { font-family: var(--t-title-font, 'Playfair Display'), serif; font-size: 72px; margin: 0 0 20px 0; letter-spacing: 2px; line-height: 1; }
        .l-cine-row { z-index: 2; position: relative; padding: 80px 4% 40px 4%; margin-top: auto; }
        
        /* LAYOUT: SAAS / DENSE */
        #vod-root.layout-dense { flex-direction: row; }
        .l-dense-side { width: 250px; background: var(--t-surf); padding: 20px; border-right: var(--t-border); }
        .l-dense-item { padding: 10px; border-radius: var(--t-rad); margin-bottom: 5px; font-size: 14px; color: var(--t-mut); }
        .l-dense-item.active { background: var(--t-acc); color: #fff; }
        .l-dense-main { flex: 1; padding: 30px; }
        .l-dense-list { display: flex; flex-direction: column; gap: 15px; }
        .l-dense-row { display: flex; gap: 15px; background: var(--t-surf); padding: 10px; border-radius: var(--t-rad); align-items: center; }
        .l-dense-thumb { width: 60px; height: 90px; border-radius: calc(var(--t-rad) / 2); background-size: cover;}
        .l-dense-info { flex: 1; }
        
        /* LAYOUT: SPLIT */
        #vod-root.layout-split { flex-direction: row; }
        .l-split-left { flex: 1; background: var(--t-surf); display: flex; flex-direction: column; justify-content: center; padding: 10%; border-right: var(--t-border); }
        .l-split-right { flex: 1; padding: 40px; overflow-y: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        
        /* LAYOUT: SHOWCASE */
        #vod-root.layout-showcase { flex-direction: column; align-items: center; justify-content: center; position: relative; }
        .l-show-bg { position: absolute; inset: 0; background-size: cover; background-position: center; filter: blur(30px); opacity: 0.4; z-index: 1; }
        .l-show-box { z-index: 2; display: flex; gap: 40px; align-items: center; background: var(--t-surf); padding: 40px; border-radius: var(--t-rad); box-shadow: var(--t-shadow); border: var(--t-border); max-width: 800px; }
        
        /* LAYOUT: GLASS */
        #vod-root.layout-glass { padding: 40px; background: linear-gradient(135deg, var(--t-bg), var(--t-acc)); display: flex; align-items: center; justify-content: center; }
        .l-glass-panel { background: rgba(0,0,0,0.5); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-radius: var(--t-rad); border: var(--t-border); padding: 40px; box-shadow: var(--t-shadow); width: 100%; max-width: 1000px; }
        
        /* LAYOUT: CARDS */
        #vod-root.layout-cards { flex-direction: column; padding: 40px; }
        .l-cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 30px; }
        .l-cards-item { background: var(--t-surf); border-radius: var(--t-rad); border: var(--t-border); overflow: hidden; box-shadow: var(--t-shadow); }
        
        /* LAYOUT: BENTO */
        #vod-root.layout-bento { padding: 40px; display: grid; grid-template-columns: 2fr 1fr; grid-template-rows: auto auto; gap: 20px; }
        .l-bento-hero { grid-column: 1 / 2; grid-row: 1 / 3; background: var(--t-surf); border-radius: var(--t-rad); border: var(--t-border); box-shadow: var(--t-shadow); position: relative; overflow: hidden; min-height: 400px; }
        .l-bento-side1 { grid-column: 2 / 3; grid-row: 1 / 2; background: var(--t-surf); border-radius: var(--t-rad); border: var(--t-border); box-shadow: var(--t-shadow); padding: 20px; display: flex; align-items: center; gap: 15px;}
        .l-bento-side2 { grid-column: 2 / 3; grid-row: 2 / 3; background: var(--t-surf); border-radius: var(--t-rad); border: var(--t-border); box-shadow: var(--t-shadow); padding: 20px; }
        
        /* LAYOUT: OVERLAY */
        #vod-root.layout-overlay { padding: 40px; display: flex; flex-direction: column; gap: 40px; }
        .l-overlay-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .l-overlay-card { position: relative; height: 350px; border-radius: var(--t-rad); overflow: hidden; box-shadow: var(--t-shadow); border: var(--t-border); }
        .l-overlay-card::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, var(--t-surf) 10%, transparent 60%); pointer-events: none; }
        .l-overlay-text { position: absolute; bottom: 20px; left: 20px; z-index: 2; }
        
        /* LAYOUT: TIMELINE */
        #vod-root.layout-timeline { padding: 40px; max-width: 800px; margin: 0 auto; flex-direction: column; }
        .l-time-item { display: flex; gap: 30px; margin-bottom: 40px; position: relative; }
        .l-time-item::before { content:''; position:absolute; left: 150px; top:0; bottom:-40px; width:2px; background:var(--t-border); z-index:1; }
        .l-time-item:last-child::before { display:none; }
        .l-time-year { flex: 0 0 120px; text-align: right; font-family: var(--t-title-font); font-size: 24px; color: var(--t-acc); font-weight: bold; }
        .l-time-dot { width:16px; height:16px; background:var(--t-acc); border-radius:50%; position:absolute; left:143px; top:8px; z-index:2; box-shadow: 0 0 10px var(--t-acc); }
        .l-time-content { flex: 1; background: var(--t-surf); border-radius: var(--t-rad); border: var(--t-border); box-shadow: var(--t-shadow); display: flex; padding: 20px; gap: 20px;}
    </style>
</head>
<body>

    <header>
        <div>
            <h1 style="margin:0; font-size: 20px;">NetFilmx <span style="color:var(--app-accent)">Design Tool</span></h1>
            <div style="font-size: 12px; color: #a1a1aa; margin-top: 4px;">Zarządzaj 50 wariantami motywów. Oceny (TTL 7 dni)</div>
        </div>
        <div class="filters">
            <button class="btn active" id="btn-all" onclick="filterData('all')">Wszystkie</button>
            <button class="btn" id="btn-rated" onclick="filterData('rated')">Ocenione</button>
            <select id="sort-select" onchange="sortData(this.value)">
                <option value="id">Sortuj: Domyślnie</option>
                <option value="rating-desc">Ocena: Od najwyższej</option>
                <option value="rating-asc">Ocena: Od najniższej</option>
            </select>
        </div>
    </header>

    <main id="catalog">
        <!-- Rendered via JS -->
    </main>

    <!-- Modal -->
    <div id="modal">
        <div class="modal-container">
            <div class="modal-sidebar">
                <div>
                    <div style="font-size:12px; color: #a1a1aa; text-transform:uppercase;">Aktualny Motyw</div>
                    <h2 id="m-title">Wariant Nazwa</h2>
                </div>
                
                <div class="rating-box">
                    <div style="font-size: 13px; color: #a1a1aa; margin-bottom: 10px;">Twoja ocena</div>
                    <div class="stars" id="m-stars">
                        <span onclick="setRating(1)">★</span>
                        <span onclick="setRating(2)">★</span>
                        <span onclick="setRating(3)">★</span>
                        <span onclick="setRating(4)">★</span>
                        <span onclick="setRating(5)">★</span>
                    </div>
                </div>

                <div>
                    <div style="font-size:12px; color: #a1a1aa; text-transform:uppercase; margin-bottom: 10px;">Wybierz Układ (Layout)</div>
                    <div id="layout-buttons-container" style="display:flex; flex-direction:column; gap:5px;">
                        <!-- Rendered via JS -->
                    </div>
                </div>
                
                <button class="btn close-btn" onclick="closeModal()">Zamknij</button>
            </div>
            
            <div class="modal-main">
                <div class="browser-frame">
                    <div class="browser-header" style="position:relative;">
                        <div class="win-controls">
                            <div class="win-btn">─</div>
                            <div class="win-btn">□</div>
                            <div class="win-btn close">✕</div>
                        </div>
                        <div class="browser-tabs">
                            <div class="browser-tab active">
                                <span style="display:inline-block; width:12px; height:12px; background:var(--app-accent); border-radius:50%;"></span>
                                NetFilmx | Browse
                            </div>
                            <div style="color: #9aa0a6; padding: 4px; font-weight: bold; cursor:default;">+</div>
                        </div>
                        <div class="browser-toolbar">
                            <span style="color:#9aa0a6; font-size:18px;">←</span>
                            <span style="color:#5f6368; font-size:18px;">→</span>
                            <span style="color:#9aa0a6; font-size:16px;">↻</span>
                            <div class="browser-url">https://netfilmx.pl/browse</div>
                        </div>
                    </div>
                    <div class="browser-body">
                        <div id="vod-root">
                            <!-- Injected by JS -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ---------------------------------------------------------
        // DATA GENERATION (50 Variants)
        // ---------------------------------------------------------
        const baseMovies = [
            { title: "Mroczny Rycerz", poster: "https://m.media-amazon.com/images/M/MV5BMTMxNTMwODM0NF5BMl5BanBnXkFtZTcwODAyMTk2Mw@@._V1_FMjpg_UX1000_.jpg", year: "2008", genre: "Akcja" },
            { title: "Incepcja", poster: "https://m.media-amazon.com/images/M/MV5BMjAxMzY3NjcxNF5BMl5BanBnXkFtZTcwNTI5OTM0Mw@@._V1_FMjpg_UX1000_.jpg", year: "2010", genre: "Sci-Fi" },
            { title: "Avengers", poster: "https://m.media-amazon.com/images/M/MV5BNDYxNjQyMjAtNTdiOS00NGYwLWFmNTAtNThmYjU5ZGI2YTI1XkEyXkFqcGdeQXVyMTMxODk2OTU@._V1_FMjpg_UX1000_.jpg", year: "2012", genre: "Akcja" },
            { title: "Matrix", poster: "https://m.media-amazon.com/images/M/MV5BNzQzOTk3OTAtNDQ0Zi00ZTVkLWI0MTEtMDllZjNkYzNjNTc4L2ltYWdlXkEyXkFqcGdeQXVyNjU0OTQ0OTY@._V1_FMjpg_UX1000_.jpg", year: "1999", genre: "Sci-Fi" },
            { title: "Podziemny Krąg", poster: "https://m.media-amazon.com/images/M/MV5BMmEzNTkxYjQtZTc0MC00YTVjLTg5ZTEtZWMwOWVlYzY0NWIwXkEyXkFqcGdeQXVyNzkwMjQ5NzM@._V1_FMjpg_UX1000_.jpg", year: "1999", genre: "Dramat" },
            { title: "Gwiezdne Wojny", poster: "https://m.media-amazon.com/images/M/MV5BOTA5NjhiOTAtZWM0ZC00MWNhLThiMzEtZDFkOTk2OTU1ZDJkXkEyXkFqcGdeQXVyMTA4NDI1NTQx._V1_FMjpg_UX1000_.jpg", year: "1977", genre: "Sci-Fi" },
            { title: "Władca Pierścieni", poster: "https://m.media-amazon.com/images/M/MV5BN2EyZjM3NzUtNWUzMi00MTgxLWI0NTctMzY4M2VlOTdjZWRiXkEyXkFqcGdeQXVyNDUzOTQ5MjY@._V1_FMjpg_UX1000_.jpg", year: "2001", genre: "Fantasy" },
            { title: "Forrest Gump", poster: "https://m.media-amazon.com/images/M/MV5BNWIwODRlZTUtY2U3ZS00Yzg1LWJhNzYtMmZiYmEyNmU1NjMzXkEyXkFqcGdeQXVyMTQxNzMzNDI@._V1_FMjpg_UX1000_.jpg", year: "1994", genre: "Dramat" },
            { title: "Skazani na Shawshank", poster: "https://m.media-amazon.com/images/M/MV5BMDFkYTc0MGEtZmNhMC00ZDIzLWFmNTEtODM1ZmRlYWMwMWFmXkEyXkFqcGdeQXVyMTMxODk2OTU@._V1_FMjpg_UX1000_.jpg", year: "1994", genre: "Dramat" },
            { title: "Ojciec Chrzestny", poster: "https://m.media-amazon.com/images/M/MV5BM2MyNjYxNmUtYTAwNi00MTYxLWJmNWYtYzZlODY3ZTk3OTFlXkEyXkFqcGdeQXVyNzkwMjQ5NzM@._V1_FMjpg_UX1000_.jpg", year: "1972", genre: "Kryminał" }
        ];

        let movies = [];
        for (let i = 0; i < 15; i++) {
            baseMovies.forEach(m => movies.push({...m}));
        }
        // Pseudo-random deterministic shuffle
        for (let i = movies.length - 1; i > 0; i--) {
            const j = (i * 31) % (i + 1);
            [movies[i], movies[j]] = [movies[j], movies[i]];
        }
        const posters = movies.map(m => m.poster);

        const baseColors = [
            { name: "Deep Navy", bg: "#020617", surf: "#0f172a", acc: "#3b82f6" },
            { name: "Pure Obsidian", bg: "#000000", surf: "#111111", acc: "#ffffff" },
            { name: "Purple Haze", bg: "#1e1e2e", surf: "#313244", acc: "#cba6f7" },
            { name: "Crimson Dark", bg: "#1a0505", surf: "#2e0f0f", acc: "#ef4444" },
            { name: "Forest Night", bg: "#064e3b", surf: "#065f46", acc: "#10b981" },
            { name: "Cyber Neon", bg: "#050510", surf: "transparent", acc: "#ff003c" },
            { name: "Sepia Warm", bg: "#292524", surf: "#44403c", acc: "#d97706" },
            { name: "Slate Minimal", bg: "#0f111a", surf: "#1e293b", acc: "#8b5cf6" },
            { name: "Stripe Blue", bg: "#0A2540", surf: "rgba(255,255,255,0.05)", acc: "#635BFF" },
            { name: "Monochrome", bg: "#18181b", surf: "#27272a", acc: "#e4e4e7" }
        ];

        const fonts = ["Inter", "Roboto", "JetBrains Mono", "system-ui"];
        const radii = ["0px", "4px", "8px", "16px", "999px"];
        const borders = ["1px solid transparent", "1px solid rgba(255,255,255,0.1)", "2px solid var(--t-acc)"];
        const shadows = ["none", "0 10px 30px rgba(0,0,0,0.5)", "0 0 20px var(--t-acc)"];
        
        const allLayoutsPool = [
            {id: "minimal", name: "Minimal (Kafelki)"},
            {id: "cinematic", name: "Cinematic (Hero)"},
            {id: "dense", name: "Dense (SaaS/List)"},
            {id: "split", name: "Split Screen"},
            {id: "showcase", name: "Showcase"},
            {id: "glass", name: "Glass Dashboard"},
            {id: "cards", name: "Card Grid"},
            {id: "bento", name: "Bento Box"},
            {id: "overlay", name: "Poster Overlay"},
            {id: "timeline", name: "Timeline List"}
        ];
        
        function isDark(hex) {
            if(hex.startsWith("rgba") || hex === "transparent") return true;
            if(!hex.startsWith("#")) return true;
            let r = parseInt(hex.slice(1,3), 16) || 0;
            let g = parseInt(hex.slice(3,5), 16) || 0;
            let b = parseInt(hex.slice(5,7), 16) || 0;
            let luma = 0.2126 * r + 0.7152 * g + 0.0722 * b;
            return luma < 128;
        }
        
        let variants = [];
        for (let i = 0; i < 50; i++) {
            let base = baseColors[i % baseColors.length];
            let font = fonts[(i * 3) % fonts.length];
            let radius = radii[(i * 7) % radii.length];
            let border = borders[(i * 11) % borders.length];
            let shadow = shadows[(i * 13) % shadows.length];
            
            let variation = Math.floor(i / baseColors.length); // 0, 1, 2, 3, 4
            let bg = base.bg;
            let surf = base.surf;
            let acc = base.acc;
            let nameSuffix = base.name;
            
            // Generate 5 distinct curated variations for each of the 10 base colors
            if (variation === 1) {
                acc = "#fbbf24"; // Gold Edition
                nameSuffix += " (Gold Edition)";
            } else if (variation === 2) {
                surf = "rgba(255,255,255,0.03)"; // Glass Edition
                nameSuffix += " (Frosted Glass)";
            } else if (variation === 3) {
                acc = "#ffffff"; // Minimal Mono
                nameSuffix += " (Minimal Mono)";
            } else if (variation === 4) {
                acc = "#10b981"; // Emerald
                nameSuffix += " (Emerald)";
            }
            
            // Smart layout selection based on theme features
            let eligible = [...allLayoutsPool];
            let preferred = [];
            
            let isBgDark = isDark(bg);
            
            if (isBgDark && (surf === "transparent" || surf.includes("rgba"))) {
                preferred.push(allLayoutsPool.find(l => l.id === "glass"));
            }
            if (radius === "999px" || radius === "16px") {
                preferred.push(allLayoutsPool.find(l => l.id === "bento"));
                preferred.push(allLayoutsPool.find(l => l.id === "split"));
            }
            if (font === "Playfair Display" || font === "system-ui") {
                preferred.push(allLayoutsPool.find(l => l.id === "timeline"));
                preferred.push(allLayoutsPool.find(l => l.id === "cinematic"));
            }
            if (border.includes("solid") && border !== "1px solid transparent") {
                preferred.push(allLayoutsPool.find(l => l.id === "cards"));
                preferred.push(allLayoutsPool.find(l => l.id === "dense"));
            }
            if (shadow !== "none") {
                preferred.push(allLayoutsPool.find(l => l.id === "showcase"));
                preferred.push(allLayoutsPool.find(l => l.id === "overlay"));
            }
            if (radius === "0px") {
                preferred.push(allLayoutsPool.find(l => l.id === "minimal"));
            }
            
            // Fill missing to 3 layouts
            preferred = [...new Set(preferred)].filter(Boolean); // deduplicate
            let picked = preferred;
            
            if (picked.length < 3) {
                let remaining = eligible.filter(l => !picked.find(p => p.id === l.id));
                remaining.sort(() => 0.5 - Math.random());
                picked = picked.concat(remaining.slice(0, 3 - picked.length));
            } else if (picked.length > 3) {
                picked.sort(() => 0.5 - Math.random());
                picked = picked.slice(0, 3);
            }
            
            let myLayouts = [ {id: "standard", name: "Standard (Netflix)"}, ...picked ];
            let recommended = myLayouts[1].id; // The first non-standard is recommended
            
            variants.push({
                id: i + 1,
                name: `Wariant ${i + 1} - ${nameSuffix}`,
                bg: bg,
                surf: surf,
                acc: acc,
                txt: "#ffffff",
                mut: "rgba(255,255,255,0.5)",
                font: font,
                titleFont: font === 'system-ui' ? 'Arial' : font,
                radius: radius,
                border: border,
                shadow: shadow,
                layouts: myLayouts,
                recommended: recommended
            });
        }

        // ---------------------------------------------------------
        // STORAGE (localStorage + TTL)
        // ---------------------------------------------------------
        const STORAGE_KEY = 'netfilmx_design_ratings';
        const TTL_DAYS = 7;
        
        function loadRatings() {
            try {
                let data = JSON.parse(localStorage.getItem(STORAGE_KEY));
                if (data && data.timestamp) {
                    let ageDays = (Date.now() - data.timestamp) / (1000 * 60 * 60 * 24);
                    if (ageDays < TTL_DAYS) {
                        return data.ratings;
                    } else {
                        console.log("TTL expired. Clearing ratings.");
                        localStorage.removeItem(STORAGE_KEY);
                    }
                }
            } catch (e) {}
            return {};
        }
        
        function saveRatings(ratingsMap) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({
                timestamp: Date.now(),
                ratings: ratingsMap
            }));
        }

        let userRatings = loadRatings();

        // ---------------------------------------------------------
        // RENDERING CATALOG
        // ---------------------------------------------------------
        let currentFilter = 'all';
        let currentSort = 'id';
        let currentVariant = null;
        
        function renderCatalog() {
            let catalog = document.getElementById('catalog');
            catalog.innerHTML = '';
            
            let displayList = [...variants];
            
            if (currentFilter === 'rated') {
                displayList = displayList.filter(v => userRatings[v.id]);
            }
            
            if (currentSort === 'rating-desc') {
                displayList.sort((a, b) => (userRatings[b.id] || 0) - (userRatings[a.id] || 0));
            } else if (currentSort === 'rating-asc') {
                displayList.sort((a, b) => (userRatings[a.id] || 0) - (userRatings[b.id] || 0));
            } else {
                displayList.sort((a, b) => a.id - b.id);
            }
            
            displayList.forEach(v => {
                let ratingStr = userRatings[v.id] ? '★'.repeat(userRatings[v.id]) : 'Brak oceny';
                
                let html = `
                    <div class="theme-card" onclick="openModal(${v.id})" style="border-radius: ${v.radius}; border: ${v.border}">
                        <div class="theme-preview" style="background: linear-gradient(135deg, ${v.bg} 0%, ${v.surf} 100%);">
                            <div style="font-family: ${v.titleFont}; color: ${v.acc}; font-size: 24px; font-weight: 800; letter-spacing: -1px; margin-bottom: 15px; text-shadow: 0 2px 10px rgba(0,0,0,0.5);">NETFILMX</div>
                            <div style="display:flex; gap:12px;">
                                <div class="mini-poster" style="border-radius: calc(${v.radius} / 2); background-image: url('${posters[0]}'); box-shadow: ${v.shadow}"></div>
                                <div class="mini-poster" style="border-radius: calc(${v.radius} / 2); background-image: url('${posters[1]}'); box-shadow: ${v.shadow}; margin-top: -10px;"></div>
                                <div class="mini-poster" style="border-radius: calc(${v.radius} / 2); background-image: url('${posters[2]}'); box-shadow: ${v.shadow}"></div>
                            </div>
                        </div>
                        <div class="theme-info" style="background: ${v.surf}; color: ${v.txt}; border-top: 1px solid rgba(255,255,255,0.05);">
                            <div class="theme-name" style="font-family: ${v.font}">${v.name}</div>
                            <div class="theme-rating">${ratingStr}</div>
                        </div>
                    </div>
                `;
                catalog.innerHTML += html;
            });
        }
        
        function filterData(f) {
            currentFilter = f;
            document.querySelectorAll('.filters .btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + f).classList.add('active');

        }
        
        function sortData(s) {
            currentSort = s;

        // MODAL & VOD MOCK

        function openModal(id) {
            currentVariant = variants.find(v => v.id === id);
            document.getElementById('m-title').innerText = currentVariant.name;
            
            let btnContainer = document.getElementById('layout-buttons-container');
            btnContainer.innerHTML = '';
            currentVariant.layouts.forEach((l, idx) => {
                let recSpan = l.id === currentVariant.recommended ? ' <span style="font-size:11px; opacity:0.7;">(Zalecany)</span>' : '';
                btnContainer.innerHTML += `<button class="btn layout-btn ${idx===0 ? 'active' : ''}" id="btn-l-${l.id}" onclick="setLayout('${l.id}')">${l.name}${recSpan}</button>`;
            });

            updateStarsUI(userRatings[id] || 0);
            document.getElementById('modal').classList.add('open');
            setLayout(currentVariant.recommended);
        }
        
        function closeModal() {
            document.getElementById('modal').classList.remove('open');
            renderCatalog();
        }
        
        function setRating(val) {
            userRatings[currentVariant.id] = val;
            saveRatings(userRatings);
            updateStarsUI(val);
        }
        
        function updateStarsUI(val) {
            let spans = document.querySelectorAll('#m-stars span');
            spans.forEach((span, i) => {
                span.classList.toggle('active', i < val);

                        <h3 style="margin:0 0 15px 0; color:var(--t-acc);">Ostatnio oglądane</h3>
                        <div style="display:flex; gap:10px;">
                            <div style="width:60px; height:90px; background:url('${posters[2]}') center/cover; border-radius:calc(var(--t-rad) / 2);"></div>
                            <div style="width:60px; height:90px; background:url('${posters[3]}') center/cover; border-radius:calc(var(--t-rad) / 2);"></div>
                            <div style="width:60px; height:90px; background:url('${posters[4]}') center/cover; border-radius:calc(var(--t-rad) / 2);"></div>
                        </div>
                    </div>
                `;
            }
            else if(layout === 'overlay') {
                html = `
                    <h1 style="font-family:var(--t-title-font); text-align:center; color:var(--t-acc); margin-top:0;">Kolekcja Premium</h1>
                    <div class="l-overlay-grid">
                        ${movies.slice(0,24).map(m => `
                            <div class="l-overlay-card">
                                <div style="position:absolute; inset:0; background:url('${m.poster}') center/cover;"></div>
                                <div class="l-overlay-text">
                                    <h3 style="margin:0; font-family:var(--t-title-font);">${m.title}</h3>
                                    <div style="color:var(--t-mut); font-size:12px; margin-top:5px;">${m.year} • ${m.genre}</div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }
            else if(layout === 'timeline') {
                html = `
                    <h1 style="text-align:center; margin-bottom: 50px; font-family:var(--t-title-font);">Historia Kina</h1>
                    ${movies.slice(0,10).map((m, idx) => `
                        <div class="l-time-item">
                            <div class="l-time-year">${m.year}</div>
                            <div class="l-time-dot"></div>
                            <div class="l-time-content">
                                <div style="width:100px; height:150px; background:url('${m.poster}') center/cover; border-radius:calc(var(--t-rad) / 2); flex-shrink:0;"></div>
                                <div>
                                    <h2 style="margin:0 0 10px 0; font-family:var(--t-title-font);">${m.title}</h2>
                                    <p style="color:var(--t-mut); font-size:14px; margin:0; line-height:1.5;">${m.genre} • Opis najważniejszego wydarzenia filmowego w tym roku. Niezapomniane wrażenia z seansu.</p>
                                    <button style="margin-top:15px; padding:8px 16px; background:var(--t-acc); color:#fff; border:none; border-radius:var(--t-rad);">Odtwórz</button>
                                </div>
                            </div>
                        </div>
                    `).join('')}
                `;
            }
            
            root.innerHTML = html;
        }

        renderCatalog();
    </script>
</body>
</html>
