name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: ghcr.io/szczepangrela/netfilmx-movie-catalog

jobs:
  test:
    name: Test and audit (.NET 10)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_DB: netfilmx_test
          POSTGRES_USER: netfilmx_test
          POSTGRES_PASSWORD: local-ci-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: NetFilmx_Web/package-lock.json
      - name: Audit and test browser dependencies
        working-directory: NetFilmx_Web
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=low
          npm run vendor:check
          npm test
      - name: Test release client
        run: python3 -m unittest discover -s tests -v
      - name: Install native media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Restore and audit locked NuGet dependencies
        run: dotnet restore "ST2 NetFilmx.sln" --locked-mode --force
      - name: Build and test
        env:
          NETFILMX_TEST_POSTGRES: Host=localhost;Database=netfilmx_test;Username=netfilmx_test;Password=local-ci-test
        run: |
          dotnet build "ST2 NetFilmx.sln" --no-restore -c Release
          dotnet test "ST2 NetFilmx.sln" --no-build -c Release --logger "trx;LogFileName=tests.trx" --results-directory artifacts/test-results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-results
          path: artifacts/test-results/*.trx
          retention-days: 7

  container:
    name: Qualify exact image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build one image with its source revision
        run: |
          mkdir -p artifacts/image
          docker build --provenance=false --file infra/Dockerfile --build-arg "RELEASE_REVISION=${GITHUB_SHA}" --tag "netfilmx:test-${GITHUB_SHA}" .
      - name: Qualify image, database, private keys, catalogue and restart
        run: bash infra/image-smoke.sh "netfilmx:test-${GITHUB_SHA}" "$GITHUB_SHA"
      - name: Scan fixable HIGH and CRITICAL findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: netfilmx:test-${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Generate image SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: netfilmx:test-${{ github.sha }}
          format: spdx-json
          output: artifacts/image/sbom.spdx.json
      - name: Save the qualified image without rebuilding
        run: |
          mkdir -p artifacts/image
          docker save --output artifacts/image/image.tar "netfilmx:test-${GITHUB_SHA}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qualified-image
          path: artifacts/image/
          compression-level: 0
          retention-days: 3

  quality-gate:
    name: Quality gate
    if: always()
    needs: [test, container]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require application and image qualification
        env:
          TEST_RESULT: ${{ needs.test.result }}
          IMAGE_RESULT: ${{ needs.container.result }}
        run: |
          test "$TEST_RESULT" = success
          test "$IMAGE_RESULT" = success

  publish:
    name: Publish tested digest
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: qualified-image
          path: artifacts/image
      - name: Publish the same tested image
        id: push
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker load --input artifacts/image/image.tar
          docker tag "netfilmx:test-${GITHUB_SHA}" "${IMAGE_NAME}:${GITHUB_SHA}"
          docker push "${IMAGE_NAME}:${GITHUB_SHA}"
          image_ref="$(docker image inspect --format '{{index .RepoDigests 0}}' "${IMAGE_NAME}:${GITHUB_SHA}")"
          digest="${image_ref##*@}"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest qualified image provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Attest the tested image SBOM
        uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # v3
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: artifacts/image/sbom.spdx.json
          push-to-registry: true
      - name: Record artifact for protected promotion
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          echo "Image: ${IMAGE_NAME}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
          echo "Revision: ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo 'Production promotion awaits the reviewed private Coolify/stateful contract.' >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy tested digest
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.PRODUCTION_DEPLOY_ENABLED == 'true' &&
      vars.COOLIFY_RELEASE_CONTRACT_ACCEPTED == 'true'
    needs: [publish, quality-gate]
    permissions:
      contents: read
      attestations: read
      id-token: write
      packages: read
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      digest: ${{ needs.publish.outputs.digest }}
      expected_revision: ${{ github.sha }}
