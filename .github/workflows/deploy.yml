name: Deploy

on:
  workflow_call:
    inputs:
      digest:
        description: Immutable GHCR manifest digest
        required: true
        type: string
      expected_revision:
        description: Commit expected in the image revision label
        required: true
        type: string
  workflow_dispatch:
    inputs:
      digest:
        description: "Previously attested digest (sha256:...)"
        required: true
        type: string
      expected_revision:
        description: "Optional full commit SHA; leave empty to use the image label"
        required: false
        default: ""
        type: string

permissions: {}

concurrency:
  group: production
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/szczepangrela/netfilmx-movie-catalog

jobs:
  preflight:
    name: Verify release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      attestations: read
      contents: read
      packages: read
    outputs:
      deploy: ${{ steps.freshness.outputs.deploy }}
      revision: ${{ steps.image.outputs.revision }}
    steps:
      - name: Validate immutable digest
        env:
          DIGEST: ${{ inputs.digest }}
        run: |
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid image digest." >&2
            exit 64
          fi
      - name: Verify GitHub artifact attestation
        env:
          DIGEST: ${{ inputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          gh attestation verify "oci://${IMAGE_NAME}@${DIGEST}" --repo "$GITHUB_REPOSITORY" --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/ci-cd.yml" --source-ref refs/heads/main --predicate-type https://slsa.dev/provenance/v1 --deny-self-hosted-runners
      - name: Read and verify image revision
        id: image
        env:
          DIGEST: ${{ inputs.digest }}
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
        run: |
          docker pull "${IMAGE_NAME}@${DIGEST}" >/dev/null
          revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${IMAGE_NAME}@${DIGEST}")"
          if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Image has no valid revision label." >&2
            exit 1
          fi
          if [[ -n "$EXPECTED_REVISION" && "$revision" != "$EXPECTED_REVISION" ]]; then
            echo "Image revision does not match the caller commit." >&2
            exit 1
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - name: Reject a stale automatic deployment
        id: freshness
        env:
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          deploy=true
          if [[ "$EVENT_NAME" == push && -n "$EXPECTED_REVISION" ]]; then
            main_revision="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
            if [[ "$main_revision" != "$EXPECTED_REVISION" ]]; then
              echo "Skipping stale deployment for $EXPECTED_REVISION; main is $main_revision."
              deploy=false
            fi
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

  deploy:
    name: Production
    needs: preflight
    if: needs.preflight.outputs.deploy == 'true' && vars.COOLIFY_RELEASE_CONTRACT_ACCEPTED == 'true'
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Authenticate read access to saved release images
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Connect to Tailscale
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci-vps
      - name: Validate production configuration
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_APPLICATION_UUID: ${{ vars.COOLIFY_APPLICATION_UUID }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_CONTRACT_JSON: ${{ secrets.COOLIFY_CONTRACT_JSON }}
        run: |
          for value in \
            "$COOLIFY_URL" \
            "$COOLIFY_APPLICATION_UUID" \
            "$PRODUCTION_URL" \
            "$COOLIFY_TOKEN" \
            "$COOLIFY_CONTRACT_JSON"; do
            test -n "$value"
          done
      - name: Materialize reviewed private contract
        env:
          COOLIFY_CONTRACT_JSON: ${{ secrets.COOLIFY_CONTRACT_JSON }}
        run: |
          python3 - <<'PYCONTRACT'
          import os
          from pathlib import Path
          directory = Path('artifacts')
          directory.mkdir(exist_ok=True, mode=0o700)
          path = directory / 'coolify-production.json'
          descriptor = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(descriptor, 'w') as output:
              output.write(os.environ['COOLIFY_CONTRACT_JSON'])
          PYCONTRACT
      - name: Deploy through Coolify and verify production
        env:
          DIGEST: ${{ inputs.digest }}
          EXPECTED_REVISION: ${{ needs.preflight.outputs.revision }}
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_APPLICATION_UUID: ${{ vars.COOLIFY_APPLICATION_UUID }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          python -m infra.coolify_release \
            --coolify-url "$COOLIFY_URL" \
            --application-uuid "$COOLIFY_APPLICATION_UUID" \
            --public-url "$PRODUCTION_URL" \
            --digest "$DIGEST" \
            --expected-revision "$EXPECTED_REVISION"

      - name: Remove temporary private contract
        if: always()
        run: |
          python3 - <<'PYCONTRACT'
          from pathlib import Path
          Path('artifacts/coolify-production.json').unlink(missing_ok=True)
          PYCONTRACT
