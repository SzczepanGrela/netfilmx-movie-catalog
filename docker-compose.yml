# Fresh PG18 development environment only; retain the old pgdata volume.
# Use a separate project: docker compose -p netfilmx-pg18 up -d
services:
  postgres:
    image: docker.io/library/postgres:18.6-trixie@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    restart: unless-stopped
    cpus: 1
    mem_limit: 512m
    memswap_limit: 512m
    environment:
      PGDATA: /var/lib/postgresql/18/docker
      POSTGRES_DB: netfilmx_db
      POSTGRES_USER: netfilmx_user
      POSTGRES_PASSWORD: ${NETFILMX_DEV_POSTGRES_PASSWORD:?Set a local development password}
    ports:
      - "127.0.0.1:${NETFILMX_DEV_POSTGRES_PORT:-15432}:5432"
    volumes:
      - pg18data:/var/lib/postgresql
    command: ["postgres", "-c", "max_wal_size=64MB", "-c", "min_wal_size=32MB", "-c", "temp_file_limit=32768"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netfilmx_user -d netfilmx_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pg18data:
